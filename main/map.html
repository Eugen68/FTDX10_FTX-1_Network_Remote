    if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
  }
  return { pts, minLon, maxLon, minLat, maxLat };
});

const spots = new Map();   // call -> {call, grid, snr, ch, t, rf, lat, lon}
const links = new Map();   // "A|B" (sorted) -> {a, b, t}: two stations seen exchanging directed messages
let me = null;             // {grid, lat, lon}
let selected = null;
let hover = null;
let hits = [];
let W = 0, H = 0, dpr = 1;

const wrap = document.getElementById('mapWrap');
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const rowsEl = document.getElementById('rows');
const inputEl = document.getElementById('myGrid');

// ---- Maidenhead / geodesy ----
function gridToLatLon(g) {
  g = g.toUpperCase();
  let lon = (g.charCodeAt(0) - 65) * 20 - 180 + Number(g[2]) * 2;
  let lat = (g.charCodeAt(1) - 65) * 10 - 90 + Number(g[3]);
  if (g.length >= 6) {
    lon += (g.charCodeAt(4) - 65) * (2 / 24) + 1 / 24;
    lat += (g.charCodeAt(5) - 65) * (1 / 24) + 1 / 48;
  } else {
    lon += 1;
    lat += 0.5;
  }
  return { lat, lon };
}

function distBearing(a, b) {
  const p1 = a.lat * RAD, p2 = b.lat * RAD, dl = (b.lon - a.lon) * RAD;
  const h = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  const km = 2 * R_EARTH_KM * Math.asin(Math.min(1, Math.sqrt(h)));
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return { km, brg: (Math.atan2(y, x) / RAD + 360) % 360 };
}

// Great-circle points between a and b as [lat, lon] pairs
function greatCircle(a, b, n) {
  const p1 = a.lat * RAD, l1 = a.lon * RAD, p2 = b.lat * RAD, l2 = b.lon * RAD;
  const v1 = [Math.cos(p1) * Math.cos(l1), Math.cos(p1) * Math.sin(l1), Math.sin(p1)];
  const v2 = [Math.cos(p2) * Math.cos(l2), Math.cos(p2) * Math.sin(l2), Math.sin(p2)];
  const dot = Math.max(-1, Math.min(1, v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2]));
  const om = Math.acos(dot);
  const out = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    let k1, k2;
    if (om < 1e-9) { k1 = 1 - f; k2 = f; }
    else { k1 = Math.sin((1 - f) * om) / Math.sin(om); k2 = Math.sin(f * om) / Math.sin(om); }
    const x = k1 * v1[0] + k2 * v2[0], y = k1 * v1[1] + k2 * v2[1], z = k1 * v1[2] + k2 * v2[2];
    out.push([Math.atan2(z, Math.hypot(x, y)) / RAD, Math.atan2(y, x) / RAD]);
  }
  return out;
}

// ---- View (pan / zoom) ----
const ZMAX = 40;
let z = 1, clon = 0, clat = 0;   // zoom (1 = whole world fits) and the lon/lat at the centre of the view
let k = 1, ox = 0, oy = 0;       // pixels per degree, and the pixel position of (lon -180, lat +90)

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function px(lon) { return ox + (lon + 180) * k; }
function py(lat) { return oy + (90 - lat) * k; }

function layout() {
  k = Math.min(W / 360, H / 180) * z;
  const mw = 360 * k, mh = 180 * k;
  ox = mw <= W ? (W - mw) / 2 : clamp(W / 2 - (clon + 180) * k, W - mw, 0);
  oy = mh <= H ? (H - mh) / 2 : clamp(H / 2 - (90 - clat) * k, H - mh, 0);
  clon = (W / 2 - ox) / k - 180;
  clat = 90 - (H / 2 - oy) / k;
  document.getElementById('zInfo').textContent = '\u00d7' + z.toFixed(z < 10 ? 1 : 0);
}

function setZoom(nz, X, Y) {   // keeps the point under (X, Y) fixed
  nz = clamp(nz, 1, ZMAX);
  const lon = (X - ox) / k - 180, lat = 90 - (Y - oy) / k;
  const nk = Math.min(W / 360, H / 180) * nz;
  z = nz;
  clon = (W / 2 - (X - (lon + 180) * nk)) / nk - 180;
  clat = 90 - (H / 2 - (Y - (90 - lat) * nk)) / nk;
  layout();
}

function panBy(dx, dy) { clon -= dx / k; clat += dy / k; layout(); }

function revealSpot(s) {   // bring a spot into view if it is off-screen
  const X = px(s.lon), Y = py(s.lat);
  if (X < 20 || X > W - 20 || Y < 20 || Y > H - 20) { clon = s.lon; clat = s.lat; layout(); }
}

// ---- Drawing ----
// Match the canvas to the map area. Returns true when the size changed.
function fitCanvas() {
  const r = wrap.getBoundingClientRect();
  const nd = window.devicePixelRatio || 1;
  const nw = Math.max(1, r.width), nh = Math.max(1, r.height);
  if (nw === W && nh === H && nd === dpr) return false;
  dpr = nd;
  W = nw;
  H = nh;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  layout();
  return true;
}

function resize() {
  fitCanvas();
  draw();
}

let raf = 0;
function redraw() {
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); });
}

function fadeOf(s, now) { return Math.max(0.25, 1 - 0.75 * (now - s.t) / TTL_MS); }

function gridLines(dLon, dLat, lonMin, lonMax, latMin, latMax) {
  const x0 = px(lonMin), x1 = px(lonMax), y0 = py(latMax), y1 = py(latMin);
  ctx.beginPath();
  for (let lo = Math.ceil(lonMin / dLon) * dLon; lo <= lonMax; lo += dLon) { ctx.moveTo(px(lo), y0); ctx.lineTo(px(lo), y1); }
  for (let la = Math.ceil(latMin / dLat) * dLat; la <= latMax; la += dLat) { ctx.moveTo(x0, py(la)); ctx.lineTo(x1, py(la)); }
  ctx.stroke();
}

function infoText(s, now) {
  const lines = [`${s.call}  ${s.grid}`, `SNR ${s.snr >= 0 ? '+' : ''}${s.snr} dB  ${s.band ? s.band + '  ' : ''}${s.ch.toUpperCase()}`];
  if (me) {
    const db = distBearing(me, s);
    lines.push(`${Math.round(db.km).toLocaleString('en-US')} km  ${Math.round(db.brg)}\u00b0`);
  }
  lines.push(ageText(now - s.t) + ' ago');
  const ps = partnersOf(s.call, now);
  if (ps.length) lines.push('QSO: ' + ps.map((p) => p.call + (spots.has(p.call) ? '' : '(?)')).join(' '));
  return lines;
}

// Stations that `call` has recently exchanged messages with, newest first
function partnersOf(call, now) {
  const out = [];
  for (const l of links.values()) {
    if (now - l.t >= TTL_MS) continue;
    if (l.a === call) out.push({ call: l.b, t: l.t });
    else if (l.b === call) out.push({ call: l.a, t: l.t });
  }
  return out.sort((x, y) => y.t - x.t);
}

function draw() {
  const now = Date.now();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#0a1a2f';
  ctx.fillRect(ox, oy, 360 * k, 180 * k);

  // Part of the world that is on screen
  const lonMin = Math.max(-180, -ox / k - 180), lonMax = Math.min(180, (W - ox) / k - 180);
  const latMax = Math.min(90, 90 + oy / k), latMin = Math.max(-90, 90 - (H - oy) / k);

  // Land
  ctx.fillStyle = '#1f3b2c';
  ctx.strokeStyle = '#2f5a43';
  ctx.lineWidth = 0.8;
  ctx.lineJoin = 'round';
  for (const r of COAST) {
    if (r.maxLon < lonMin || r.minLon > lonMax || r.maxLat < latMin || r.minLat > latMax) continue;
    const p = r.pts;
    ctx.beginPath();
    ctx.moveTo(px(p[0]), py(p[1]));
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(px(p[i]), py(p[i + 1]));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Maidenhead grid: fields (20 x 10 degrees) always, squares (2 x 1 degrees) once zoomed in
  ctx.lineWidth = 1;
  if (2 * k >= 14) {
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    gridLines(2, 1, lonMin, lonMax, latMin, latMax);
  }
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  gridLines(20, 10, lonMin, lonMax, latMin, latMax);
  ctx.fillStyle = 'rgba(148,163,184,0.28)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (2 * k >= 44) {
    const i0 = Math.max(0, Math.floor((lonMin + 180) / 2)), i1 = Math.min(180, Math.ceil((lonMax + 180) / 2));
    const j0 = Math.max(0, Math.floor(latMin + 90)), j1 = Math.min(180, Math.ceil(latMax + 90));
    for (let i = i0; i < i1; i++) {
      for (let j = j0; j < j1; j++) {
        const label = String.fromCharCode(65 + Math.floor(i / 10), 65 + Math.floor(j / 10)) + (i % 10) + (j % 10);
        ctx.fillText(label, px(-180 + i * 2 + 1), py(-90 + j + 0.5));
      }
    }
  } else if (20 * k >= 36) {
    for (let i = 0; i < 18; i++) {
      for (let j = 0; j < 18; j++) {
        const lo = -180 + i * 20 + 10, la = -90 + j * 10 + 5;
        if (lo < lonMin || lo > lonMax || la < latMin || la > latMax) continue;
        ctx.fillText(String.fromCharCode(65 + i, 65 + j), px(lo), py(la));
      }
    }
  }

  const list = [...spots.values()].filter((s) => now - s.t < TTL_MS);
  list.sort((a, b) => ((a.call === selected) - (b.call === selected)) || (a.t - b.t));   // selected on top
  const focus = hover || selected;

  // Great-circle lines from my station
  if (me) {
    for (const s of list) {
      const isFocus = s.call === focus;
      const path = greatCircle(me, s, 64);
      ctx.strokeStyle = bandColor(s);
      ctx.globalAlpha = isFocus ? 0.95 : fadeOf(s, now) * 0.3;
      ctx.lineWidth = isFocus ? 2 : 1;
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        const X = px(path[i][1]), Y = py(path[i][0]);
        // break the line where it wraps across the antimeridian
        if (i === 0 || Math.abs(path[i][1] - path[i - 1][1]) > 180) ctx.moveTo(X, Y);
        else ctx.lineTo(X, Y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // QSO links between two plotted stations; the ones touching the hovered / selected station stand out
  for (const l of links.values()) {
    if (now - l.t >= TTL_MS) continue;
    const sa = spots.get(l.a), sb = spots.get(l.b);
    if (!sa || !sb) continue;
    const isFocus = l.a === focus || l.b === focus;
    if (focus && !isFocus) ctx.globalAlpha = 0.12;
    else ctx.globalAlpha = isFocus ? 1 : Math.max(0.25, 1 - 0.75 * (now - l.t) / TTL_MS) * 0.6;
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = isFocus ? 2.5 : 1.5;
    const path = greatCircle(sa, sb, 64);
    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const X = px(path[i][1]), Y = py(path[i][0]);
      if (i === 0 || Math.abs(path[i][1] - path[i - 1][1]) > 180) ctx.moveTo(X, Y);
      else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Spots: only a mark; the callsign appears when the mark is clicked
  hits = [];
  let selPos = null;
  for (const s of list) {
    const X = px(s.lon), Y = py(s.lat);
    if (X < -12 || X > W + 12 || Y < -12 || Y > H + 12) continue;
    const isSel = s.call === selected, isHover = s.call === hover;
    ctx.globalAlpha = isSel || isHover ? 1 : fadeOf(s, now);
    ctx.fillStyle = bandColor(s);
    ctx.strokeStyle = isSel ? '#ffffff' : '#0b1120';
    ctx.lineWidth = isSel ? 2 : 1.5;
    ctx.beginPath();
    ctx.arc(X, Y, isSel || isHover ? 6 : 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    hits.push({ call: s.call, X, Y });
    if (isSel) selPos = { X, Y };
  }
  ctx.globalAlpha = 1;

  // My station
  if (me) {
    const X = px(me.lon), Y = py(me.lat);
    ctx.fillStyle = '#f43f5e';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(X, Y - 7); ctx.lineTo(X + 7, Y); ctx.lineTo(X, Y + 7); ctx.lineTo(X - 7, Y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fda4af';
    ctx.textAlign = 'left';
    ctx.fillText('ME ' + me.grid, X + 10, Y);
  }

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox + 0.5, oy + 0.5, 360 * k - 1, 180 * k - 1);

  // Info box next to the selected mark
  const sel = selected && spots.get(selected);
  if (sel && selPos) {
    const lines = infoText(sel, now);
    const same = hits.filter((h) => Math.hypot(h.X - selPos.X, h.Y - selPos.Y) <= 10).length;
    if (same > 1) lines.push(`${same} stations here (click to cycle)`);
    tip.textContent = lines.join('\n');
    tip.style.display = 'block';
    tip.style.left = Math.max(4, Math.min(selPos.X + 14, W - tip.offsetWidth - 4)) + 'px';
    tip.style.top = Math.max(4, Math.min(selPos.Y + 14, H - tip.offsetHeight - 4)) + 'px';
  } else {
    tip.style.display = 'none';
  }
}

// ---- Spot table ----
function ageText(ms) {
  const s = Math.floor(ms / 1000);
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's';
}

// Legend: only the bands that currently have a station on the map
function renderLegend(list) {
  const present = new Set(list.map((s) => s.band || ''));
  const el = document.getElementById('legend');
  el.textContent = '';
  const names = BAND_ORDER.filter((b) => present.has(b));
  if (present.has('')) names.push('?');
  for (const b of names) {
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = BAND_COLOR[b] || BAND_UNKNOWN;
    dot.style.marginLeft = '.6em';
    el.appendChild(dot);
    el.appendChild(document.createTextNode(b));
  }
}

function renderTable() {
  const now = Date.now();
  const list = [...spots.values()].filter((s) => now - s.t < TTL_MS).sort((a, b) => b.t - a.t);
  document.getElementById('count').textContent = list.length + ' stations';
  renderLegend(list);
  rowsEl.textContent = '';
  for (const s of list) {
    const db = me ? distBearing(me, s) : null;
    const cells = [
      s.call, s.grid, s.band || '--',
      db ? Math.round(db.km).toLocaleString('en-US') : '--',
      db ? Math.round(db.brg) + '\u00b0' : '--',
      (s.snr >= 0 ? '+' : '') + s.snr,
      s.ch.toUpperCase(),
      ageText(now - s.t),
      partnersOf(s.call, now).map((p) => p.call).join(' ')
    ];
    const tr = document.createElement('tr');
    if (s.call === selected) tr.className = 'sel';
    cells.forEach((c, i) => {
      const td = document.createElement('td');
      td.textContent = c;
      if (i === 2) td.style.color = bandColor(s);
      tr.appendChild(td);
    });
    tr.addEventListener('click', () => {
      selected = selected === s.call ? null : s.call;
      if (selected) revealSpot(s);
      renderTable();
      draw();
    });
    rowsEl.appendChild(tr);
  }
}

function refresh() {
  const now = Date.now();
  for (const [k, s] of spots) if (now - s.t >= TTL_MS) spots.delete(k);
  for (const [k, l] of links) if (now - l.t >= TTL_MS) links.delete(k);
  renderTable();
  fitCanvas();   // the table just changed its height, which changes the map area
  draw();
}

// ---- My grid ----
function applyMyGrid(text, persist) {
  const g = text.trim().toUpperCase();
  const info = document.getElementById('myInfo');
  if (g === '') {
    me = null;
    info.textContent = '';
    if (persist) localStorage.removeItem(STORAGE_KEY);
    inputEl.classList.remove('invalid');
    return true;
  }
  if (!GRID_RE.test(g) || g.length === 5) {
    inputEl.classList.add('invalid');
    return false;
  }
  inputEl.classList.remove('invalid');
  const p = gridToLatLon(g);
  me = { grid: g, lat: p.lat, lon: p.lon };
  info.textContent = `${Math.abs(p.lat).toFixed(2)}${p.lat >= 0 ? 'N' : 'S'} ${Math.abs(p.lon).toFixed(2)}${p.lon >= 0 ? 'E' : 'W'}`;
  if (persist) localStorage.setItem(STORAGE_KEY, g);
  return true;
}

document.getElementById('setGrid').addEventListener('click', () => {
  if (applyMyGrid(inputEl.value, true)) refresh();
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('setGrid').click();
});

// ---- Incoming spots (validated: the channel carries data from the main page only) ----
function acceptSpot(d) {
  if (!d || typeof d !== 'object') return;
  const call = typeof d.call === 'string' ? d.call.toUpperCase() : '';
  const grid = typeof d.grid === 'string' ? d.grid.toUpperCase() : '';
  if (!CALL_RE.test(call) || !/^[A-R]{2}[0-9]{2}$/.test(grid)) return;
  if (d.ch !== 'Main' && d.ch !== 'Sub') return;
  const snr = Number(d.snr), t = Number(d.t);
  if (!Number.isFinite(snr) || !Number.isFinite(t) || t > Date.now() + 60000) return;
  const band = typeof d.band === 'string' && Object.prototype.hasOwnProperty.call(BAND_COLOR, d.band) ? d.band : '';
  const prev = spots.get(call);
  if (prev && prev.t > t) return;
  const p = gridToLatLon(grid);
  spots.set(call, { call, grid, snr: Math.max(-40, Math.min(40, Math.round(snr))), ch: d.ch, t, band, lat: p.lat, lon: p.lon });
  if (spots.size > MAX_SPOTS) spots.delete(spots.keys().next().value);
}

function acceptLink(d) {
  if (!d || typeof d !== 'object') return;
  const a = typeof d.a === 'string' ? d.a.toUpperCase() : '';
  const b = typeof d.b === 'string' ? d.b.toUpperCase() : '';
  if (!CALL_RE.test(a) || !CALL_RE.test(b) || a === b) return;
  const t = Number(d.t);
  if (!Number.isFinite(t) || t > Date.now() + 60000) return;
  const key = [a, b].sort().join('|');
  const prev = links.get(key);
  if (prev && prev.t > t) return;
  links.set(key, { a, b, t });
  if (links.size > 2 * MAX_SPOTS) links.delete(links.keys().next().value);
}

const bc = new BroadcastChannel(CHANNEL_NAME);
bc.onmessage = (e) => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'spot') acceptSpot(d.spot);
  else if (d.type === 'link') acceptLink(d.link);
  else if (d.type === 'snapshot' && Array.isArray(d.spots)) {
    d.spots.slice(0, MAX_SPOTS).forEach(acceptSpot);
    if (Array.isArray(d.links)) d.links.slice(0, 2 * MAX_SPOTS).forEach(acceptLink);
  }
  else return;
  refresh();
};

// ---- Interaction: drag = pan, wheel / double click / buttons = zoom, click a mark = show its callsign ----
let drag = null;

function localXY(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function hitAt(X, Y) {   // nearest mark within 10 px, the newest wins a tie
  let best = null, bd = 10;
  for (let i = hits.length - 1; i >= 0; i--) {
    const d = Math.hypot(hits[i].X - X, hits[i].Y - Y);
    if (d < bd) { bd = d; best = hits[i].call; }
  }
  return best;
}

function pickAt(X, Y) {   // stations drawn on top of each other: every click selects the next one
  const near = hits.slice().reverse().filter((h) => Math.hypot(h.X - X, h.Y - Y) <= 10);
  if (near.length === 0) return null;
  const i = near.findIndex((h) => h.call === selected);
  return near[(i + 1) % near.length].call;
}

cv.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
});

cv.addEventListener('pointermove', (e) => {
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    drag.x = e.clientX;
    drag.y = e.clientY;
    cv.style.cursor = 'grabbing';
    panBy(dx, dy);
    redraw();
    return;
  }
  const [X, Y] = localXY(e);
  const h = hitAt(X, Y);
  cv.style.cursor = h ? 'pointer' : 'grab';
  if (h !== hover) { hover = h; redraw(); }
});

cv.addEventListener('pointerup', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const moved = drag.moved;
  drag = null;
  cv.style.cursor = 'grab';
  if (moved) return;
  const [X, Y] = localXY(e);
  selected = pickAt(X, Y);
  renderTable();
  draw();
});

cv.addEventListener('pointercancel', () => { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('pointerleave', () => { if (!drag && hover) { hover = null; redraw(); } });

cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const [X, Y] = localXY(e);
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  setZoom(z * Math.exp(-dy * 0.0015), X, Y);
  redraw();
}, { passive: false });

cv.addEventListener('dblclick', (e) => {
  const [X, Y] = localXY(e);
  setZoom(z * 2, X, Y);
  redraw();
});

document.getElementById('zIn').addEventListener('click', () => { setZoom(z * 1.5, W / 2, H / 2); redraw(); });
document.getElementById('zOut').addEventListener('click', () => { setZoom(z / 1.5, W / 2, H / 2); redraw(); });
document.getElementById('zFit').addEventListener('click', () => { z = 1; clon = 0; clat = 0; layout(); redraw(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selected && document.activeElement !== inputEl) {
    selected = null;
    renderTable();
    draw();
  }
});

// The map area also shrinks or grows when the station table below it changes height (not only when the window
// is resized), so observe the area itself. Otherwise the canvas keeps a stale size and its bottom is cut off.
new ResizeObserver(resize).observe(wrap);
setInterval(refresh, 5000);

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { inputEl.value = saved; applyMyGrid(saved, false); }
} catch (e) { /* storage unavailable */ }
resize();
renderTable();
bc.postMessage({ type: 'hello' });   // ask the main page for the spots collected so far
</script>
<noscript>JavaScript is required.</noscript>
</body>
</html>
